services:
  - type: web
    name: days-out
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
